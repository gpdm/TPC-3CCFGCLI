name: JUnit Test Report

on:
  push:
    paths:
      # Trigger whenever a generated JUnit report is added or changed.
      - 'LOGS/**/*.JUNIT.XML'

  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  render-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render JUnit reports
        uses: dorny/test-reporter@v3
        if: always()
        with:
          name: '3CCFGCLI Test Results'
          path: 'LOGS/**/*.JUNIT.XML'
          reporter: java-junit

          report-title: '3CCFGCLI Test Results'
          use-actions-summary: true

          list-suites: all
          list-tests: all
          collapsed: never

          fail-on-error: false
          fail-on-empty: false
